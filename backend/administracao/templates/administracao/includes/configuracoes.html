<section id="painel-configuracoes" data-admin-painel="configuracoes" role="tabpanel" aria-labelledby="aba-configuracoes" tabindex="0" hidden>
  <section aria-labelledby="config-areas-titulo">
    <div class="flex flex-wrap items-start justify-between gap-4">
      <div>
        <h2 id="config-areas-titulo" class="m-0 text-lg font-extrabold tracking-[-0.02em] text-tinta">Áreas atendidas</h2>
        <p class="mb-0 mt-1.5 max-w-xl text-[0.8125rem] leading-relaxed text-[#67756c]">
          Cadastre áreas, defina limites geográficos e coordenadas GPS para os registros.
        </p>
      </div>
      <button type="button" disabled aria-disabled="true" class="inline-flex min-h-[2.75rem] items-center rounded-xl bg-verde-escuro px-4 text-[0.75rem] font-extrabold text-white">
        Cadastrar nova área
      </button>
    </div>

    <div class="mt-6 grid grid-cols-1 gap-4 md:grid-cols-2">
      <div class="flex flex-col gap-2">
        <label for="config-area-nome" class="text-[0.6875rem] font-extrabold text-[#5e6b73]">Nome da área</label>
        <input id="config-area-nome" type="text" disabled aria-disabled="true" placeholder="Ex.: Centro" class="h-11 w-full rounded-xl border border-borda bg-[#fdfcf9] px-3.5 text-[0.8125rem] text-tinta" />
      </div>
      <div class="flex flex-col gap-2">
        <label for="config-area-regiao" class="text-[0.6875rem] font-extrabold text-[#5e6b73]">Região</label>
        <input id="config-area-regiao" type="text" disabled aria-disabled="true" placeholder="Ex.: Zona norte" class="h-11 w-full rounded-xl border border-borda bg-[#fdfcf9] px-3.5 text-[0.8125rem] text-tinta" />
      </div>
      <div class="flex flex-col gap-2">
        <label for="config-area-latitude" class="text-[0.6875rem] font-extrabold text-[#5e6b73]">Latitude</label>
        <input id="config-area-latitude" type="text" inputmode="decimal" disabled aria-disabled="true" placeholder="-00.000000" class="h-11 w-full rounded-xl border border-borda bg-[#fdfcf9] px-3.5 text-[0.8125rem] text-tinta" />
      </div>
      <div class="flex flex-col gap-2">
        <label for="config-area-longitude" class="text-[0.6875rem] font-extrabold text-[#5e6b73]">Longitude</label>
        <input id="config-area-longitude" type="text" inputmode="decimal" disabled aria-disabled="true" placeholder="-00.000000" class="h-11 w-full rounded-xl border border-borda bg-[#fdfcf9] px-3.5 text-[0.8125rem] text-tinta" />
      </div>
      <div class="flex flex-col gap-2 md:col-span-2">
        <label for="config-area-limites" class="text-[0.6875rem] font-extrabold text-[#5e6b73]">Limites geográficos</label>
        <textarea id="config-area-limites" rows="3" disabled aria-disabled="true" placeholder="Coordenadas que delimitam a área" class="w-full rounded-xl border border-borda bg-[#fdfcf9] px-3.5 py-2.5 text-[0.8125rem] text-tinta"></textarea>
      </div>
    </div>

    <div class="mt-3 flex flex-wrap gap-2">
      <button type="button" disabled aria-disabled="true" class="inline-flex min-h-[2.5rem] items-center rounded-xl border border-verde px-3.5 text-[0.6875rem] font-extrabold text-verde">Definir no mapa</button>
    </div>

    <div class="mt-6 overflow-x-auto rounded-[1.25rem] border border-borda">
      <table class="w-full min-w-[32rem] border-collapse text-left">
        <thead class="bg-[#fdfcf9]">
          <tr>
            <th scope="col" class="px-4 py-3 text-[0.625rem] font-extrabold uppercase tracking-[0.08em] text-[#879389]">Região</th>
            <th scope="col" class="px-4 py-3 text-[0.625rem] font-extrabold uppercase tracking-[0.08em] text-[#879389]">Coordenadas</th>
            <th scope="col" class="px-4 py-3 text-[0.625rem] font-extrabold uppercase tracking-[0.08em] text-[#879389]">Situação</th>
            <th scope="col" class="px-4 py-3 text-[0.625rem] font-extrabold uppercase tracking-[0.08em] text-[#879389]">Ações</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td colspan="4" class="px-4 py-10 text-center">
              <span class="mx-auto mb-3 grid h-11 w-11 place-items-center rounded-full bg-salvia/70 text-verde">
                <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M19 10c0 4.6-7 11-7 11S5 14.6 5 10a7 7 0 1 1 14 0Z" />
                  <circle cx="12" cy="10" r="2.2" />
                </svg>
              </span>
              <strong class="block text-sm font-extrabold text-verde-escuro">Nenhuma área cadastrada.</strong>
              <span class="mt-1 block text-[0.75rem] text-[#67756c]">As áreas permitidas aparecerão aqui.</span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="mt-4 flex flex-wrap gap-2">
      <button type="button" disabled aria-disabled="true" class="inline-flex min-h-[2.5rem] items-center rounded-xl border border-verde px-3.5 text-[0.6875rem] font-extrabold text-verde">Editar área</button>
      <button type="button" disabled aria-disabled="true" class="inline-flex min-h-[2.5rem] items-center rounded-xl border border-borda bg-[#fdfcf9] px-3.5 text-[0.6875rem] font-extrabold text-[#67756c]">Remover área</button>
    </div>

    <p class="mb-0 mt-5 rounded-xl border border-borda bg-[#fdfcf9] px-4 py-3 text-[0.75rem] leading-relaxed text-[#67756c]">
      Nenhuma área é cadastrada ou alterada nesta tela.
    </p>
  </section>
</section>
