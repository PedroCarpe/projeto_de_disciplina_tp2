<section id="painel-ocorrencias" data-admin-painel="ocorrencias" role="tabpanel" aria-labelledby="aba-ocorrencias" tabindex="0" hidden>
  <div class="flex flex-wrap items-start justify-between gap-4">
    <div>
      <h2 class="m-0 text-lg font-extrabold tracking-[-0.02em] text-tinta">Ocorrências</h2>
      <p class="mb-0 mt-1.5 max-w-xl text-[0.8125rem] leading-relaxed text-[#67756c]">
        Status das ocorrências registradas.
      </p>
    </div>
    <button type="button" disabled aria-disabled="true" class="inline-flex min-h-[2.75rem] items-center gap-2 rounded-xl border border-verde px-4 text-[0.75rem] font-extrabold text-verde">
      <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6" />
      </svg>
      Atualizar status
    </button>
  </div>

  <div class="mt-6 flex flex-wrap gap-2" role="group" aria-label="Status das ocorrências">
    <span class="inline-flex min-h-[2.25rem] items-center rounded-full border border-borda bg-salvia/40 px-3 text-[0.6875rem] font-extrabold text-verde-escuro">Pendente</span>
    <span class="inline-flex min-h-[2.25rem] items-center rounded-full border border-borda bg-salvia/40 px-3 text-[0.6875rem] font-extrabold text-verde-escuro">Em andamento</span>
    <span class="inline-flex min-h-[2.25rem] items-center rounded-full border border-borda bg-salvia/40 px-3 text-[0.6875rem] font-extrabold text-verde-escuro">Resolvida</span>
  </div>

  <div class="mt-5 overflow-x-auto rounded-[1.25rem] border border-borda">
    <table class="w-full min-w-[36rem] border-collapse text-left">
      <thead class="bg-[#fdfcf9]">
        <tr>
          <th scope="col" class="px-4 py-3 text-[0.625rem] font-extrabold uppercase tracking-[0.08em] text-[#879389]">Ocorrência</th>
          <th scope="col" class="px-4 py-3 text-[0.625rem] font-extrabold uppercase tracking-[0.08em] text-[#879389]">Tipo</th>
          <th scope="col" class="px-4 py-3 text-[0.625rem] font-extrabold uppercase tracking-[0.08em] text-[#879389]">Região</th>
          <th scope="col" class="px-4 py-3 text-[0.625rem] font-extrabold uppercase tracking-[0.08em] text-[#879389]">Status</th>
          <th scope="col" class="px-4 py-3 text-[0.625rem] font-extrabold uppercase tracking-[0.08em] text-[#879389]">Atualização</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td colspan="5" class="px-4 py-10 text-center">
            <span class="mx-auto mb-3 grid h-11 w-11 place-items-center rounded-full bg-salvia/70 text-verde">
              <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M19 10c0 4.6-7 11-7 11S5 14.6 5 10a7 7 0 1 1 14 0Z" />
                <circle cx="12" cy="10" r="2.2" />
              </svg>
            </span>
            <strong class="block text-sm font-extrabold text-verde-escuro">Nenhuma ocorrência para exibir.</strong>
            <span class="mt-1 block text-[0.75rem] text-[#67756c]">As ocorrências registradas aparecerão aqui.</span>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</section>
