<div
  class="urban-art relative mx-auto w-full max-w-[26rem] md:max-w-none md:w-[112%] md:-ml-[4%]"
  role="img"
  aria-label="Ilustração abstrata de ruas que se conectam a um marcador de localização"
>
  <svg class="street-map block w-full" viewBox="0 0 580 520" fill="none" aria-hidden="true">
    <defs>
      <pattern id="nr-pontos" width="18" height="18" patternUnits="userSpaceOnUse">
        <circle cx="1" cy="1" r="1" fill="#9FBBAA" opacity=".45" />
      </pattern>
      <linearGradient id="nr-mapa" x1="80" y1="20" x2="460" y2="500" gradientUnits="userSpaceOnUse">
        <stop stop-color="#F5F8F2" />
        <stop offset="1" stop-color="#E6EFE5" />
      </linearGradient>
      <linearGradient id="nr-pin" x1="260" y1="180" x2="332" y2="290" gradientUnits="userSpaceOnUse">
        <stop stop-color="#4E9271" />
        <stop offset="1" stop-color="#2F6B55" />
      </linearGradient>
      <filter id="nr-sombra" x="-100%" y="-50%" width="300%" height="250%">
        <feDropShadow dx="0" dy="14" stdDeviation="13" flood-color="#2F6B55" flood-opacity=".20" />
      </filter>
    </defs>

    <circle cx="300" cy="256" r="214" fill="url(#nr-mapa)" />
    <circle cx="300" cy="256" r="244" stroke="#D6E5D8" stroke-dasharray="3 7" />
    <rect x="34" y="16" width="520" height="486" fill="url(#nr-pontos)" />

    <g transform="rotate(-19 300 260)">
      <rect x="122" y="88" width="82" height="103" rx="17" fill="#DDE9DD" />
      <rect x="224" y="88" width="101" height="103" rx="17" fill="#E6EDE3" />
      <rect x="345" y="88" width="103" height="103" rx="17" fill="#DFE9E6" />
      <rect x="122" y="211" width="82" height="102" rx="17" fill="#E3ECE1" />
      <rect x="224" y="211" width="101" height="102" rx="17" fill="#E7EEE6" />
      <rect x="345" y="211" width="103" height="102" rx="17" fill="#D9E8D9" />
      <rect x="122" y="333" width="82" height="99" rx="17" fill="#E1EAE1" />
      <rect x="224" y="333" width="101" height="99" rx="17" fill="#DEE9E2" />
      <rect x="345" y="333" width="103" height="99" rx="17" fill="#E4EDE2" />

      <path d="M99 201h368M99 323h368M214 66v385M335 66v385" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" />
      <path
        d="M112 323h102V201h121"
        stroke="#7FAE8E"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-dasharray="5 7"
      />
      <circle cx="112" cy="323" r="9" fill="#FFFFFF" stroke="#8FB79A" stroke-width="3" />
      <g stroke="#9DBBA4" stroke-width="2.5" stroke-linecap="round">
        <path d="M146 124h30m-15-15v30M375 253h36m-18-18v36" />
      </g>
    </g>

    <ellipse cx="302" cy="307" rx="41" ry="12" fill="#5E8A6A" opacity=".15" />
    <ellipse cx="302" cy="307" rx="25" ry="7" fill="#5E8A6A" opacity=".18" />
    <g filter="url(#nr-sombra)">
      <path
        d="M302 173c-29 0-52 22-52 50 0 35 52 81 52 81s52-46 52-81c0-28-23-50-52-50Z"
        fill="url(#nr-pin)"
      />
      <circle cx="302" cy="224" r="19" fill="#FFFFFF" />
      <circle cx="302" cy="224" r="8" fill="#D9EBDD" />
    </g>

    <circle cx="470" cy="170" r="8" fill="#DCE9DA" />
    <circle cx="111" cy="378" r="5" fill="#9BB9A2" />
    <path d="M454 361v12m-6-6h12" stroke="#A5BCA8" stroke-width="2" stroke-linecap="round" />
  </svg>

  <div
    class="art-note absolute bottom-[17%] left-[15%] flex -rotate-3 items-center gap-3 rounded-xl border border-[#E6EDE7] bg-white/95 px-4 py-3 text-[0.75rem] font-bold text-verde-escuro shadow-[0_10px_30px_rgba(38,50,59,0.10)]"
  >
    <span class="note-icon grid h-9 w-9 shrink-0 place-items-center rounded-lg bg-salvia/70 text-verde">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5" aria-hidden="true">
        <path d="M19 10c0 5-7 10-7 10S5 15 5 10a7 7 0 1 1 14 0Z" />
        <circle cx="12" cy="10" r="2.5" />
      </svg>
    </span>
    <span class="block">
      Sua rua. Sua voz.
      <span class="mt-1 block text-[0.625rem] font-normal text-[#879389]">Uma cidade feita por todos.</span>
    </span>
    <span class="note-dot ml-3 h-1.5 w-1.5 shrink-0 rounded-full bg-salvia"></span>
  </div>
  <span class="art-caption absolute bottom-[5%] left-[40%] whitespace-nowrap text-[0.5rem] tracking-[0.15em] text-[#9BA99E]">
    CONEXÕES QUE TRANSFORMAM
  </span>
</div>
