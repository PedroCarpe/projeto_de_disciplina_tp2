<section id="painel-favoritos" data-notificacao-painel="favoritos" role="tabpanel" aria-labelledby="aba-favoritos" tabindex="0" hidden>
  <div class="flex flex-wrap items-start justify-between gap-4">
    <div>
      <h2 class="m-0 text-lg font-extrabold tracking-[-0.02em] text-tinta">Favoritos</h2>
      <p class="mb-0 mt-1.5 max-w-xl text-[0.8125rem] leading-relaxed text-[#67756c]">
        Ocorrências específicas que você decide acompanhar.
      </p>
    </div>
  </div>

  <div class="mt-6 flex flex-col items-center gap-3 rounded-[1.25rem] border border-dashed border-borda bg-[#fdfcf9] px-5 py-10 text-center">
    <span class="grid h-11 w-11 place-items-center rounded-full bg-salvia/70 text-verde">
      <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M19 10c0 4.6-7 11-7 11S5 14.6 5 10a7 7 0 1 1 14 0Z" />
        <circle cx="12" cy="10" r="2.2" />
      </svg>
    </span>
    <strong class="text-sm font-extrabold text-verde-escuro">Nenhuma ocorrência favoritada</strong>
    <p class="mb-0 mt-1 max-w-md text-[0.75rem] leading-relaxed text-[#67756c]">
      Explore o mapa para conhecer as ocorrências da sua região.
    </p>
    <a href="{% url 'mapa' %}" class="botao botao--secundario mt-2 inline-flex items-center gap-2 rounded-[0.625rem] border-borda bg-white px-5 py-3 text-xs font-bold text-verde-escuro transition hover:bg-salvia/40">
      Explorar mapa
      <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 12h15m-5-5 5 5-5 5" />
      </svg>
    </a>
  </div>
</section>
