[tool.ruff]
target-version = "py310"  # 👈 Garante compatibilidade para quem usa da versão 3.10 em diante
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (organização de imports)
    "B",   # flake8-bugbear (detecção de bugs comuns)
    "DJ",  # flake8-django (boas práticas específicas do Django)
]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Arquivos de scaffold gerados pelo startapp mantêm imports para uso futuro.
"usuarios/admin.py" = ["F401"]
"usuarios/models.py" = ["F401"]
"usuarios/tests.py" = ["F401"]
"usuarios/views.py" = ["F401"]

[tool.mypy]
python_version = "3.10"  # 👈 Mypy valida assumindo o Python 3.10 como base
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "setup.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "setup.settings"
python_files = ["test_*.py", "*_test.py"]
addopts = "--cov=. --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
# Pontos de entrada gerados pelo Django não contêm regra de negócio.
omit = [
    "manage.py",
    "setup/asgi.py",
    "setup/wsgi.py",
]
