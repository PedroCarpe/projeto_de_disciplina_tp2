<section id="painel-usuarios" data-admin-painel="usuarios" role="tabpanel" aria-labelledby="aba-usuarios" tabindex="0" hidden>
  <div class="flex flex-wrap items-start justify-between gap-4">
    <div>
      <h2 class="m-0 text-lg font-extrabold tracking-[-0.02em] text-tinta">Usuários</h2>
      <p class="mb-0 mt-1.5 max-w-xl text-[0.8125rem] leading-relaxed text-[#67756c]">
        Contas cadastradas na plataforma.
      </p>
    </div>
    <button type="button" disabled aria-disabled="true" class="inline-flex min-h-[2.75rem] items-center gap-2 rounded-xl bg-verde-escuro px-4 text-[0.75rem] font-extrabold text-white">
      <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="5" y="10" width="14" height="10" rx="2" />
        <path d="M8 10V7a4 4 0 0 1 8 0v3" />
      </svg>
      Bloquear usuário
    </button>
  </div>

  <p class="mb-0 mt-5 rounded-xl border border-borda bg-[#fdfcf9] px-4 py-3 text-[0.75rem] leading-relaxed text-[#67756c]">
    Nenhuma conta é alterada nesta tela.
  </p>

  <div class="mt-5 overflow-x-auto rounded-[1.25rem] border border-borda">
    <table class="w-full min-w-[32rem] border-collapse text-left">
      <thead class="bg-[#fdfcf9]">
        <tr>
          <th scope="col" class="px-4 py-3 text-[0.625rem] font-extrabold uppercase tracking-[0.08em] text-[#879389]">Usuário</th>
          <th scope="col" class="px-4 py-3 text-[0.625rem] font-extrabold uppercase tracking-[0.08em] text-[#879389]">E-mail</th>
          <th scope="col" class="px-4 py-3 text-[0.625rem] font-extrabold uppercase tracking-[0.08em] text-[#879389]">Perfil</th>
          <th scope="col" class="px-4 py-3 text-[0.625rem] font-extrabold uppercase tracking-[0.08em] text-[#879389]">Situação</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td colspan="4" class="px-4 py-10 text-center">
            <span class="mx-auto mb-3 grid h-11 w-11 place-items-center rounded-full bg-salvia/70 text-verde">
              <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="9" cy="8" r="3.2" />
                <path d="M3 19v-1a6 6 0 0 1 12 0v1M16 5.2a3.2 3.2 0 0 1 0 5.6M18 19v-1a5.9 5.9 0 0 0-2-4.3" />
              </svg>
            </span>
            <strong class="block text-sm font-extrabold text-verde-escuro">Nenhum usuário disponível para administração.</strong>
            <span class="mt-1 block text-[0.75rem] text-[#67756c]">As contas cadastradas aparecerão aqui.</span>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</section>
